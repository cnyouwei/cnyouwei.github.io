<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Wei You's Home Page">
  <meta name="author" content="Wei You">
  <title>{{ page.title }}</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-124664957-1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}  
    gtag('js', new Date());
    gtag('config', 'UA-124664957-1');
  </script>

  <!-- Fonts & CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body data-bs-spy="scroll" data-bs-target="#navMenu" data-bs-offset="80" tabindex="0">

  <!-- NAVIGATION -->
  <nav class="navbar navbar-expand-lg fixed-top navbar-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Wei You</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto gap-lg-4">
          <li class="nav-item"><a class="nav-link {% if page.name=='home' %}active{% endif %}" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link {% if page.name=='research' %}active{% endif %}" href="index.html#research">Research</a></li>
          <li class="nav-item"><a class="nav-link {% if page.name=='talks' %}active{% endif %}" href="talks.html">Talks</a></li>
          <li class="nav-item"><a class="nav-link" href="CV.pdf" target="_blank">CV</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- PAGE CONTENT -->
  {{ content }}

  <!-- FOOTER -->
  <footer class="py-2 text-center">
    <div class="container">
      <small>© 2025 <strong>Wei You</strong></small>
    </div>
  </footer>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init({ once: true, duration: 700, easing: 'ease-out-cubic' });
  </script>
</body>
</html>
